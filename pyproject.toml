[project]
name = "soul-framework"
version = "0.2.0"
description = "Persistent AI souls — memory, personality, identity for any LLM agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "William Tovar", email = "william@gtl.pe" },
]
keywords = ["ai", "agent", "memory", "personality", "soul", "ocean", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiosqlite>=0.20.0",
]

[project.scripts]
soul = "soul_framework.cli:main"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]
llm = ["httpx>=0.27.0"]
graph = ["neo4j>=5.20.0"]
all = ["soul-framework[embeddings,llm,graph]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
